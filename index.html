<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>STEP to GLB Converter</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 30px auto; padding: 0 20px; }
        #drop-zone { border: 2px dashed #007bff; padding: 40px; text-align: center; border-radius: 8px; cursor: pointer; background: #f8f9fa; }
        #drop-zone.hover { background: #e2e6ea; }
        .file-list { margin-top: 15px; max-height: 200px; overflow-y: auto; border: 1px solid #ccc; padding: 10px; border-radius: 4px; }
        .form-group { margin-top: 20px; }
        input[type="text"] { width: 100%; padding: 8px; box-sizing: border-box; }
        button { background: #28a745; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 4px; cursor: pointer; margin-top: 15px; }
        button:disabled { background: #6c757d; cursor: not-allowed; }
    </style>
</head>
<body>
    <h2>STEP to GLB Batch Converter</h2>
    
    <div id="drop-zone"><span id="drop-zone-text">Drag & Drop Folder Here or Click to Select Folder</span>
        <input type="file" id="folder-input" name="files" webkitdirectory directory multiple style="display:none;">
    </div>

    <div class="form-group">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <strong>Detected STEP Files:</strong>
            <span id="file-counter" style="font-weight: bold; color: #007bff; display: none;"></span>
        </div>
        <div id="file-list" class="file-list">No files selected</div>
    </div>



    <button id="convert-btn" disabled>Convert All Files</button>
    <p id="status-text"></p>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const folderInput = document.getElementById('folder-input');
        const fileListDiv = document.getElementById('file-list');
        const convertBtn = document.getElementById('convert-btn');
        const statusText = document.getElementById('status-text');

        let stepFiles = [];
        let uploadFolderName = "converted_glbs";

        dropZone.addEventListener('click', () => folderInput.click());
        folderInput.addEventListener('change', (e) => handleFiles(e.target.files));

        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('hover'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('hover'));
        dropZone.addEventListener('drop', async (e) => {
            e.preventDefault();
            dropZone.classList.remove('hover');
            const items = e.dataTransfer.items;
            stepFiles = [];
            uploadFolderName = "converted_glbs";
            for (let item of items) {
                const entry = item.webkitGetAsEntry();
                if (entry) {
                    if (entry.isDirectory && uploadFolderName === "converted_glbs") {
                        uploadFolderName = entry.name;
                    }
                    await scanFiles(entry);
                }
            }
            updateFileListUI();
        });

        async function scanFiles(entry) {
            const nameLower = entry.name.toLowerCase();
            if (entry.isFile && (nameLower.endsWith('.step') || nameLower.endsWith('.stp'))) {
                const file = await new Promise((resolve) => entry.file(resolve));
                // Remove the leading slash from fullPath if present
                file.customRelativePath = entry.fullPath.startsWith('/') ? entry.fullPath.substring(1) : entry.fullPath;
                stepFiles.push(file);
            } else if (entry.isDirectory) {
                const dirReader = entry.createReader();
                let entries = [];
                let readBatch = async () => {
                    const batch = await new Promise((resolve) => dirReader.readEntries(resolve));
                    if (batch.length > 0) {
                        entries.push(...batch);
                        await readBatch();
                    }
                };
                await readBatch();
                for (let childEntry of entries) await scanFiles(childEntry);
            }
        }

        function handleFiles(files) {
            if (files.length > 0 && files[0].webkitRelativePath) {
                const pathParts = files[0].webkitRelativePath.split('/');
                if (pathParts.length > 1) {
                    uploadFolderName = pathParts[0];
                }
            }
            stepFiles = Array.from(files).filter(f => {
                const nameLower = f.name.toLowerCase();
                if (nameLower.endsWith('.step') || nameLower.endsWith('.stp')) {
                    f.customRelativePath = f.webkitRelativePath || f.name;
                    return true;
                }
                return false;
            });
            updateFileListUI();
        }

        function updateFileListUI() {
            const fileCounterSpan = document.getElementById('file-counter');
            const dropZoneText = document.getElementById('drop-zone-text');
            if (stepFiles.length === 0) {
                fileListDiv.innerHTML = "No valid .step / .stp files found.";
                convertBtn.disabled = true;
                fileCounterSpan.style.display = "none";
                dropZoneText.innerText = "Drag & Drop Folder Here or Click to Select Folder";
                return;
            }
            fileListDiv.innerHTML = stepFiles.map(f => `<div>📄 ${f.customRelativePath || f.name}</div>`).join('');
            convertBtn.disabled = false;
            fileCounterSpan.innerText = `${stepFiles.length} file(s) selected`;
            fileCounterSpan.style.display = "inline";
            dropZoneText.innerText = `Selected Folder: ${uploadFolderName}`;
        }

        convertBtn.addEventListener('click', async () => {
            const formData = new FormData();
            stepFiles.forEach(file => formData.append('files', file, file.customRelativePath || file.name));

            statusText.innerText = "Converting... Please wait. This may take a while for large files.";
            convertBtn.disabled = true;

            try {

                // Served by a local app.py: use that server; otherwise use the deployed backend.
                const isLocal = ["localhost", "127.0.0.1"].includes(window.location.hostname);
                const BACKEND_BASE_URL = isLocal ? window.location.origin : "https://steptoglbconverter.onrender.com";

                const API_URL = `${BACKEND_BASE_URL}/convert`;

                const res = await fetch(API_URL, { method: 'POST', body: formData });

                if (res.ok) {
                    const blob = await res.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `${uploadFolderName}.zip`;
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    window.URL.revokeObjectURL(url);
                    statusText.innerText = "Success! Your converted files have been downloaded as a ZIP archive.";
                } else {
                    const result = await res.json();
                    statusText.innerText = `Error: ${result.error}`;
                }
            } catch (err) {
                statusText.innerText = "Conversion failed due to a server connection error.";
            } finally {
                convertBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
